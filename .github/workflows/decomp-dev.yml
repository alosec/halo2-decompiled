name: decomp.dev report

# Publishes the objdiff-format progress report that ByteMatch charts
# (see docs/DECOMP_DEV.md). It reads config/functions.csv only, so it needs
# neither the retail XBE nor the SDK, and it holds no secrets.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python tools/decomp_dev_export.py -o build/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: retail_report
          path: build/report.json
